#Step1 - Workflow basics
name: Order Management CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

#Step2 - Checkout source code
jobs:
  checkout:
    name: Checkout source code
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: order_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d order_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

#Step 3 - Set up Java 25 and Maven caching
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

#Step 4 - Run Spring Boot tests using Maven
      - name: Run tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/order_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          chmod +x mvnw
          mkdir -p logs
          ./mvnw -B test

#Step 5 - Build the Spring Boot Docker image using GitHub Actions
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      #- name: Build Docker image
      #  uses: docker/build-push-action@v6
      #  with:
      #    context: .
      #    push: false
      #    load: true
       #   tags: order_mgmt:latest

#Step 6 - Push your Docker image to GitHub Container Registry (GHCR)
      #Add the GHCR Login Step
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #Understand the image publishing step
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/shresthadipak/order_mgmt:latest

#Step 7 - Prepare SSH connection for deployment
      #Add SSH setup to GitHub Actions
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
        
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
        
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

#Step 8 - Connect to Oracle server using SSH
      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "echo 'SSH connection successful!'"

#Step 9 - Prepare Production Docker Compose configuration
#upload compose.prod.yaml
      - name: Copy production Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "compose.prod.yaml"
          target: "/opt/order_mgmt/"

#Step 10 -Deploy application on Oracle
      - name: Deploy to Oracle server
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /opt/order_mgmt && sudo docker compose -f compose.prod.yaml pull && sudo docker compose -f compose.prod.yaml up -d"

