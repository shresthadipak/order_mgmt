name: Order Management CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

  jobs:
    checkout:
      name: Checkout source code
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v6

        - name: Set up Java
          uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: "25"
            cache: maven


